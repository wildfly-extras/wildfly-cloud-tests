apiVersion: apps/v1
kind: Deployment
metadata:
  name: auto-registration
  labels:
    app.kubernetes.io/name: auto-registration
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: auto-registration
  template:
    metadata:
      labels:
        app.kubernetes.io/name: auto-registration
    spec:
      containers:
        - name: auto-registration
          image: localhost:5000/wildfly-cloud-tests-oidc-auto-registration:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
            - name: admin
              containerPort: 9990
          env:
            - name: OIDC_PROVIDER_NAME
              value: "keycloak"
            - name: OIDC_USER_NAME
              value: "demo"
            - name: OIDC_USER_PASSWORD
              value: "demo"
            - name: OIDC_SECURE_DEPLOYMENT_SECRET
              value: "mysecret"
            - name: OIDC_PROVIDER_URL
              value: "http://$CLUSTER_IP$:30075/realms/WildFly"
            - name: OIDC_HOSTNAME_HTTP
              value: "$CLUSTER_IP$:30074"
---
apiVersion: v1
kind: Service
metadata:
  name: auto-registration
  labels:
    app.kubernetes.io/name: auto-registration
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: auto-registration
  ports:
    - name: http
      port: 80
      targetPort: 8080
      nodePort: 30074
    - name: admin
      port: 9990
      targetPort: 9990
