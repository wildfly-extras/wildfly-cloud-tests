apiVersion: apps/v1
kind: Deployment
metadata:
  name: env-vars-override-model
  labels:
    app.kubernetes.io/name: env-vars-override-model
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: env-vars-override-model
  template:
    metadata:
      labels:
        app.kubernetes.io/name: env-vars-override-model
    spec:
      containers:
        - name: env-vars-override-model
          image: localhost:5000/wildfly-cloud-tests-core-env-vars-override-model:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
            - name: admin
              containerPort: 9990
          env:
            - name: WILDFLY_OVERRIDING_ENV_VARS
              value: "1"
            - name: SUBSYSTEM_LOGGING_ROOT_LOGGER_ROOT__LEVEL
              value: "DEBUG"
            - name: TEST_EXPRESSION_FROM_PROPERTY
              value: "testing123"
---
apiVersion: v1
kind: Service
metadata:
  name: env-vars-override-model
  labels:
    app.kubernetes.io/name: env-vars-override-model
spec:
  selector:
    app.kubernetes.io/name: env-vars-override-model
  ports:
    - name: http
      port: 8080
      targetPort: 8080
    - name: admin
      port: 9990
      targetPort: 9990
