apiVersion: apps/v1
kind: Deployment
metadata:
  name: mpconfig-sources
  labels:
    app.kubernetes.io/name: mpconfig-sources
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: mpconfig-sources
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mpconfig-sources
    spec:
      containers:
        - name: mpconfig-sources
          image: localhost:5000/wildfly-cloud-tests-mp-config-sources:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
            - name: admin
              containerPort: 9990
          env:
            - name: CONFIG_ENV_VAR
              value: "From env var"
          volumeMounts:
            - name: config-map-vol
              mountPath: /etc/config/my-config-map
            - name: secret-vol
              mountPath: /etc/config/my-secret
      volumes:
        - name: config-map-vol
          configMap:
            name: my-config-map
        - name: secret-vol
          secret:
            secretName: my-secret
---
apiVersion: v1
kind: Service
metadata:
  name: mpconfig-sources
  labels:
    app.kubernetes.io/name: mpconfig-sources
spec:
  selector:
    app.kubernetes.io/name: mpconfig-sources
  ports:
    - name: http
      port: 8080
      targetPort: 8080
    - name: admin
      port: 9990
      targetPort: 9990
