apiVersion: apps/v1
kind: Deployment
metadata:
  name: micrometer
  labels:
    app.kubernetes.io/name: micrometer
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: micrometer
  template:
    metadata:
      labels:
        app.kubernetes.io/name: micrometer
    spec:
      containers:
        - name: micrometer
          image: localhost:5000/wildfly-cloud-tests-observability-micrometer:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
            - name: admin
              containerPort: 9990
---
apiVersion: v1
kind: Service
metadata:
  name: micrometer
  labels:
    app.kubernetes.io/name: micrometer
spec:
  selector:
    app.kubernetes.io/name: micrometer
  ports:
    - name: http
      port: 8080
      targetPort: 8080
    - name: admin
      port: 9990
      targetPort: 9990
