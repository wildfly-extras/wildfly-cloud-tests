apiVersion: apps/v1
kind: Deployment
metadata:
  name: ds-postgresql
  labels:
    app.kubernetes.io/name: ds-postgresql
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: ds-postgresql
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ds-postgresql
    spec:
      containers:
        - name: ds-postgresql
          image: localhost:5000/wildfly-cloud-tests-ds-postgresql:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
            - name: admin
              containerPort: 9990
          env:
            - name: POSTGRESQL_DATABASE
              value: "postgresdb"
            - name: POSTGRESQL_USER
              value: "postgresadmin"
            - name: POSTGRESQL_PASSWORD
              value: "admin12"
            - name: POSTGRESQL_HOST
              value: "postgres-service"
            - name: POSTGRESQL_PORT
              value: "5432"
            - name: DB_SERVICE_PREFIX_MAPPING
              value: "test-postgresql=LAUNCH"
            - name: LAUNCH_DATABASE
              value: "postgresdb"
            - name: LAUNCH_USERNAME
              value: "postgresadmin"
            - name: LAUNCH_PASSWORD
              value: "admin12"
            - name: TEST_POSTGRESQL_SERVICE_HOST
              value: "postgres-service"
            - name: TEST_POSTGRESQL_SERVICE_PORT
              value: "5432"
---
apiVersion: v1
kind: Service
metadata:
  name: ds-postgresql
  labels:
    app.kubernetes.io/name: ds-postgresql
spec:
  selector:
    app.kubernetes.io/name: ds-postgresql
  ports:
    - name: http
      port: 8080
      targetPort: 8080
    - name: admin
      port: 9990
      targetPort: 9990
