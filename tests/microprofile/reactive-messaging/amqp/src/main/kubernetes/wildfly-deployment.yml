apiVersion: apps/v1
kind: Deployment
metadata:
  name: rm-amqp
  labels:
    app.kubernetes.io/name: rm-amqp
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: rm-amqp
  template:
    metadata:
      labels:
        app.kubernetes.io/name: rm-amqp
    spec:
      containers:
        - name: rm-amqp
          image: localhost:5000/wildfly-cloud-tests-microprofile-reactive-messaging-amqp:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
            - name: admin
              containerPort: 9990
          env:
            - name: AMQP_HOST
              value: "artemis"
---
apiVersion: v1
kind: Service
metadata:
  name: rm-amqp
  labels:
    app.kubernetes.io/name: rm-amqp
spec:
  selector:
    app.kubernetes.io/name: rm-amqp
  ports:
    - name: http
      port: 8080
      targetPort: 8080
    - name: admin
      port: 9990
      targetPort: 9990
