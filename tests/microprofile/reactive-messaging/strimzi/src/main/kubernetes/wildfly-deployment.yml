apiVersion: apps/v1
kind: Deployment
metadata:
  name: strimzi
  labels:
    app.kubernetes.io/name: strimzi
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: strimzi
  template:
    metadata:
      labels:
        app.kubernetes.io/name: strimzi
    spec:
      containers:
        - name: strimzi
          image: localhost:5000/wildfly-cloud-tests-microprofile-reactive-messaging-strimzi:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
            - name: admin
              containerPort: 9990
          env:
            - name: MP_MESSAGING_CONNECTOR_SMALLRYE_KAFKA_BOOTSTRAP_SERVERS
              value: "my-cluster-kafka-bootstrap:9092"
---
apiVersion: v1
kind: Service
metadata:
  name: strimzi
  labels:
    app.kubernetes.io/name: strimzi
spec:
  selector:
    app.kubernetes.io/name: strimzi
  ports:
    - name: http
      port: 8080
      targetPort: 8080
    - name: admin
      port: 9990
      targetPort: 9990
